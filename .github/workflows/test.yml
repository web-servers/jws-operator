name: Basic Tests

on:
  push:
  pull_request:
    branches: [ main ]

jobs:

  build:
    runs-on: ubuntu-latest
    env:
      K8S_VERSION: "1.28.0" # Updated to an available version
    
    steps:
    - uses: actions/checkout@v6
    
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: 1.24
        
    - name: Set up Minikube
      uses: manusa/actions-setup-minikube@v2.14.0
      with:
        minikube version: v1.35.0
        kubernetes version: v1.32.0
        driver: docker

    - name: Setup KUBEBUILDER_ASSETS
      run: |
        GOPATH_BIN="$(go env GOPATH)/bin"
        export PATH="$PATH:$GOPATH_BIN"

        echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
        go install sigs.k8s.io/controller-runtime/tools/setup-envtest@release-0.19

        ENVTEST_PATH=$($GOPATH_BIN/setup-envtest use $K8S_VERSION -p path)
        echo "Resolved KUBEBUILDER_ASSETS path: '$ENVTEST_PATH'"
        echo "KUBEBUILDER_ASSETS=$ENVTEST_PATH" >> $GITHUB_ENV
       
    - name: Make controller-gen
      run: make controller-gen
      
    - name: Set up vendor
      run: go mod vendor
      
    - name: Basic Operator's Tests
      run: |
        echo "Using KUBEBUILDER_ASSETS: $KUBEBUILDER_ASSETS"
        go test -timeout 60m $(go list ./... | grep -v /e2e) -coverprofile cover.out
