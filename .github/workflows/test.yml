name: Basic Tests

on:
  push:
  pull_request:
    branches: [ main ]

jobs:

  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v6
    
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: 1.24
        
    - name: Set up Minikube
      uses: manusa/actions-setup-minikube@v2.14.0
      with:
        minikube version: v1.35.0
        kubernetes version: v1.32.0
        driver: docker

    - name: Setup KUBEBUILDER_ASSETS
      run: |
        export K8S_VERSION=1.20.2
        export PATH=$PATH:$(go env GOPATH)/bin
        go install sigs.k8s.io/controller-runtime/tools/setup-envtest@latest
        setup-envtest use $K8S_VERSION
       
    - name: Make controller-gen
      run: make controller-gen
      
    - name: Set up vendor
      run: go mod vendor
      
    - name: Basic Operator's Tests
      run: KUBEBUILDER_ASSETS=$(setup-envtest use 1.20.2 -p path) go test -timeout 60m ./... -coverprofile cover.out
